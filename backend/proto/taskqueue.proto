syntax = "proto3";

package taskqueue.v1;

service TaskQueueService {
  rpc SubmitTask(SubmitTaskRequest) returns (SubmitTaskResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);
  rpc GetQueueStats(GetQueueStatsRequest) returns (GetQueueStatsResponse);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

message SubmitTaskRequest {
  string queue = 1;
  string payload = 2;  // JSON or opaque string
  int32 priority = 3;  // higher = more urgent (e.g. 0-10)
  int32 max_retries = 4;
  int64 delay_seconds = 5;  // optional delayed execution
  map<string, string> metadata = 6;
}

message SubmitTaskResponse {
  string task_id = 1;
  string status = 2;  // PENDING, QUEUED
}

message GetTaskRequest {
  string task_id = 1;
}

message GetTaskResponse {
  string task_id = 1;
  string status = 2;   // PENDING, QUEUED, RUNNING, SUCCESS, FAILED, CANCELLED
  string payload = 3;
  int32 priority = 4;
  int32 attempt = 5;
  int32 max_retries = 6;
  string result = 7;
  string error = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
  int64 started_at = 11;
  int64 completed_at = 12;
  map<string, string> metadata = 13;
}

message ListTasksRequest {
  string queue = 1;
  string status = 2;  // optional filter
  int32 limit = 3;
  int32 offset = 4;
}

message ListTasksResponse {
  repeated GetTaskResponse tasks = 1;
  int32 total = 2;
}

message CancelTaskRequest {
  string task_id = 1;
}

message CancelTaskResponse {
  bool cancelled = 1;
  string message = 2;
}

message GetQueueStatsRequest {
  string queue = 1;  // empty = all queues
}

message GetQueueStatsResponse {
  int64 pending_count = 1;
  int64 running_count = 2;
  int64 completed_today = 3;
  int64 failed_today = 4;
  double p99_latency_ms = 5;
  double throughput_per_sec = 6;
  map<string, int64> by_priority = 7;
}

message HealthCheckRequest {}

message HealthCheckResponse {
  string status = 1;  // SERVING, NOT_SERVING
  map<string, string> checks = 2;  // db, redis, kafka
}
