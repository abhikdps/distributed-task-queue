apiVersion: v1
kind: ConfigMap
metadata:
  name: taskqueue-config
  namespace: taskqueue
data:
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_TOPIC_TASKS: "taskqueue.tasks"
  KAFKA_TOPIC_DLQ: "taskqueue.dlq"
  KAFKA_CONSUMER_GROUP: "taskqueue-workers"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "taskqueue"
  POSTGRES_DB: "taskqueue"
  REDIS_URL: "redis://redis:6379/0"
  GRPC_HOST: "0.0.0.0"
  GRPC_PORT: "50051"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  PROMETHEUS_PORT: "9090"
  WORKER_CONCURRENCY: "4"
  WORKER_MAX_RETRIES: "5"
---
apiVersion: v1
kind: Secret
metadata:
  name: taskqueue-secret
  namespace: taskqueue
type: Opaque
stringData:
  POSTGRES_PASSWORD: "taskqueue_secret"
  # In production, replace with sealed secrets or external secret store
