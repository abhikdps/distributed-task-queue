apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: taskqueue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.48.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=7d
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: taskqueue
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: taskqueue-api
        static_configs:
          - targets: ["taskqueue-api:9090"]
      - job_name: taskqueue-workers
        static_configs:
          - targets: ["taskqueue-workers:9091"]
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: taskqueue
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: taskqueue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.2.2
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_SERVER_ROOT_URL
              value: "http://localhost:3000"
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: taskqueue
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
