apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskqueue-api
  namespace: taskqueue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskqueue-api
  template:
    metadata:
      labels:
        app: taskqueue-api
    spec:
      containers:
        - name: api
          image: taskqueue-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: taskqueue-config
            - secretRef:
                name: taskqueue-secret
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: taskqueue-api
  namespace: taskqueue
spec:
  selector:
    app: taskqueue-api
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
    - name: metrics
      port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: taskqueue-api-headless
  namespace: taskqueue
spec:
  clusterIP: None
  selector:
    app: taskqueue-api
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
